<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGOS JUAN HILARIO</title>
    <style>
        :root {
            --bg-color: #0F111A;
            --card-bg: #1B1E2B;
            --text-color: #FFFFFF;
            --subtext-color: #9CA3AF;
            --border-color: #2A2E3D;
            --gold: #D4AF37;
            --green: #10B981;
            --yellow: #F59E0B;
            --red: #EF4444;
        }

        .light-theme {
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #111827;
            --subtext-color: #4B5563;
            --border-color: #E5E7EB;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            transition: background-color 0.3s, color 0.3s; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 20px; 
            padding-top: 40px; 
            min-height: 100vh; 
        }

        /* Encabezado y Título Desplazado */
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 20px; 
        }
        .user-profile { 
            display: flex; 
            align-items: center; 
        }
        .avatar { 
            width: 44px; 
            height: 44px; 
            background: linear-gradient(135deg, var(--gold), #F59E0B); 
            color: #0F111A; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 16px; 
            margin-right: 12px; 
        }
        .app-title-container { 
            margin-top: 25px; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .app-title-container h1 { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--gold); 
            letter-spacing: 1px; 
        }

        /* Botón Tema */
        .theme-toggle { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            padding: 8px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
        }

        /* Frase Motivacional */
        .phrase-card { 
            background: var(--card-bg); 
            border-left: 4px solid var(--gold); 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 20px; 
            font-style: italic; 
            font-size: 13px; 
            line-height: 1.4; 
            border-top: 1px solid var(--border-color); 
            border-right: 1px solid var(--border-color); 
            border-bottom: 1px solid var(--border-color); 
        }

        /* Calculadora de Balance */
        .calculator-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 18px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
        }
        .calc-inputs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 12px; 
        }
        .calc-inputs input { 
            background: rgba(0,0,0,0.1); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 13px; 
            width: 100%; 
        }
        .balance-status { 
            font-size: 13px; 
            font-weight: bold; 
            margin-top: 8px; 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
        }
        .status-positive { 
            background: rgba(16, 185, 129, 0.15); 
            color: var(--green); 
            border: 1px solid var(--green); 
        }
        .status-negative { 
            background: rgba(239, 68, 68, 0.15); 
            color: var(--red); 
            border: 1px solid var(--red); 
        }

        /* Sección Alertas Destacada en ROJO */
        .alerts-section { 
            background: rgba(239, 68, 68, 0.12); 
            border: 2px solid var(--red); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }
        .alerts-title { 
            color: var(--red); 
            font-weight: bold; 
            font-size: 15px; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        /* Lista de Tarjetas con Scroll */
        .scroll-container { 
            max-height: 480px; 
            overflow-y: auto; 
            padding-right: 4px; 
            margin-bottom: 24px; 
        }
        .scroll-container::-webkit-scrollbar { width: 5px; }
        .scroll-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 14px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
            cursor: pointer;
        }
        .card::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 6px; 
            height: 100%; 
        }
        
        /* Modos de Urgencia con Desvanecido */
        .status-green::before { background-color: var(--green); }
        .status-green { background: linear-gradient(90deg, rgba(16, 185, 129, 0.12) 0%, var(--card-bg) 100%); }
        .status-yellow::before { background-color: var(--yellow); }
        .status-yellow { background: linear-gradient(90deg, rgba(245, 158, 11, 0.15) 0%, var(--card-bg) 100%); }
        .status-red::before { background-color: var(--red); }
        .status-red { background: linear-gradient(90deg, rgba(239, 68, 68, 0.18) 0%, var(--card-bg) 100%); }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 15px; font-weight: bold; }
        .card-details { 
            display: none; 
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid var(--border-color); 
            font-size: 12px; 
            color: var(--subtext-color); 
            line-height: 1.6;
        }
        .card-details.active { display: block; }

        /* Calendario */
        .calendar-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 24px; 
            border: 1px solid var(--border-color); 
        }
        .calendar-header { font-weight: bold; margin-bottom: 12px; font-size: 15px; color: var(--gold); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; }
        .day-name { font-weight: bold; color: var(--subtext-color); padding-bottom: 6px; }
        .day-cell { padding: 8px 2px; border-radius: 6px; background: rgba(0,0,0,0.05); }
        .day-cell.active-pay { background: var(--gold); color: #000; font-weight: bold; }

        .calendar-notes { display: flex; gap: 10px; overflow-x: auto; padding-top: 14px; padding-bottom: 4px; }
        .note-box { 
            min-width: 170px; 
            background: rgba(0,0,0,0.12); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 10px; 
            font-size: 11px; 
            flex-shrink: 0; 
        }

        /* Formulario Agregar (Ubicado al final) */
        .add-form-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 18px; 
            border: 1px solid var(--border-color); 
            margin-top: 20px; 
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 11px; color: var(--subtext-color); margin-bottom: 4px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            background: rgba(0,0,0,0.1); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            border-radius: 8px; 
            font-size: 13px; 
        }
        .btn-submit { 
            width: 100%; 
            background: var(--gold); 
            color: #000; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
    </style>
</head>
