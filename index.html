<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas de Juan Hilario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#E9EEEC; --surface:#FFFFFF; --ink:#13201D; --muted:#5C6B67; --line:#DCE4E1;
    --brand:#4B57D8; --green:#1F9D5A; --yellow:#E3A400; --red:#D63A3A; --track:#E3EAE7;
    --shadow:0 1px 2px rgba(19,32,29,.06), 0 8px 24px -12px rgba(19,32,29,.18);
    --font-title:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1513; --surface:#17211E; --ink:#EAF2EF; --muted:#93A59F; --line:#26332F;
      --brand:#8C96FF; --green:#3DC47E; --yellow:#F2BC2B; --red:#F26464; --track:#24312D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1513; --surface:#17211E; --ink:#EAF2EF; --muted:#93A59F; --line:#26332F;
    --brand:#8C96FF; --green:#3DC47E; --yellow:#F2BC2B; --red:#F26464; --track:#24312D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); height:100%; }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }

  /* Todo el contenido se desplaza en un solo contenedor */
  .scroll{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .wrap{ max-width:560px; margin:0 auto; padding-bottom:32px; }

  /* Encabezado */
  .top{ padding:16px 16px 4px; }
  .top-row{ display:flex; align-items:flex-start; gap:10px; }
  .top h1{
    font-family:var(--font-title); font-weight:800; font-size:23px; line-height:1.12; margin:0; flex:1;
    letter-spacing:.005em; text-transform:uppercase; padding-top:2px;
  }
  .sub{ margin:4px 0 0; color:var(--muted); font-size:13px; text-transform:capitalize; }
  .icon-btn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--line);
    background:var(--surface); display:grid; place-items:center; flex:none;
  }
  .icon-btn svg{ width:20px; height:20px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 12px; }
  .stat b{ display:block; font-family:var(--font-title); font-size:22px; font-weight:700; line-height:1.1; }
  .stat span{ font-size:12px; color:var(--muted); }

  /* Ingresos, gastos y dashboard */
  .board{ display:grid; grid-template-columns:1fr 158px; gap:8px; margin-top:8px; align-items:stretch; }
  .boxes{ display:grid; grid-template-rows:1fr 1fr; gap:8px; }
  .box{
    position:relative; text-align:left; border:1px solid var(--line); background:var(--surface);
    border-radius:16px; padding:10px 12px 10px 16px; display:flex; flex-direction:column; justify-content:center; min-width:0;
  }
  .box::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:0 4px 4px 0; background:var(--c); }
  .box small{ color:var(--muted); font-size:12px; }
  .box b{ font-family:var(--font-title); font-size:19px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; color:var(--c); }
  .box em{ font-style:normal; font-size:11.5px; color:var(--muted); }
  .box.income{ --c:var(--green); }
  .box.expense{ --c:var(--red); }

  .gauge{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 8px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .gauge-ring{ position:relative; width:122px; height:122px; flex:none; }
  .gauge-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .gauge-ring circle{ fill:none; stroke-width:14; }
  .g-bg{ stroke:var(--track); }
  .g-seg{ transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1), stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  .g-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 22px; }
  .g-center b{ font-size:12.5px; font-weight:700; }
  .g-center span{ font-family:var(--font-title); font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; }
  .g-msg{ margin:6px 0 0; font-size:11.5px; line-height:1.3; color:var(--muted); }

  /* SecciÃ³n Mis obligaciones, mÃ¡s abajo */
  .sec{ display:flex; align-items:center; gap:10px; padding:26px 16px 8px; }
  .sec h2{ font-family:var(--font-title); font-weight:800; font-size:21px; margin:0; flex:1; }
  .add-btn{
    display:flex; align-items:center; gap:6px; border:0; background:var(--brand); color:#fff;
    border-radius:14px; padding:9px 14px; font-weight:700; font-size:14px;
  }
  .add-btn svg{ width:16px; height:16px; }
  :root[data-theme="dark"] .add-btn{ color:#0E1513; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .add-btn{ color:#0E1513; } }

  .tools{ display:flex; align-items:center; gap:8px; padding:4px 16px 8px; }
  .chips{ display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px 0; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    border:1px solid var(--line); background:var(--surface); border-radius:999px;
    padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; color:var(--muted);
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .sort{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; }

  .legend{ display:flex; gap:14px; padding:0 18px 10px; font-size:12px; color:var(--muted); }
  .legend i{ display:inline-block; width:18px; height:4px; border-radius:4px; margin-right:6px; vertical-align:middle; }

  .list{ padding:4px 16px 8px; display:flex; flex-direction:column; gap:12px; }

  /* Tarjeta */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); flex:none; }
  .head{ display:flex; align-items:center; gap:12px; padding:14px 14px 10px 16px; cursor:pointer; border-radius:22px; }
  .head-main{ flex:1; min-width:0; }
  .title-row{ display:flex; align-items:center; gap:6px; }
  .title{
    margin:0; font-family:var(--font-title); font-weight:700; font-size:17px; line-height:1.2;
    text-transform:uppercase; overflow-wrap:anywhere; letter-spacing:.01em;
  }
  .edit{ border:0; background:transparent; padding:4px; border-radius:8px; color:var(--muted); flex:none; display:grid; }
  .edit svg{ width:16px; height:16px; }
  .meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .pill{ font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--track); color:var(--muted); }
  .pill.red{ background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red); }
  .pill.yellow{ background:color-mix(in srgb, var(--yellow) 22%, transparent); color:color-mix(in srgb, var(--yellow) 70%, var(--ink)); }
  .pill.green{ background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }

  .donut{ position:relative; width:64px; height:64px; flex:none; }
  .donut svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .donut .bg{ stroke:var(--track); }
  .donut .arc{ stroke:var(--brand); transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  .donut.full .arc{ stroke:var(--green); }
  .donut .num{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-title); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .donut .num small{ font-size:10px; font-weight:600; margin-left:1px; color:var(--muted); align-self:center; }
  .donut .num span{ display:flex; align-items:baseline; }

  .progress{ padding:0 16px 14px; }
  .bar{ height:10px; border-radius:999px; background:var(--track); overflow:hidden; }
  .fill{ height:100%; width:0; border-radius:inherit; background:var(--c); transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .bar-info{ display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:12.5px; color:var(--muted); }
  .bar-info b{ color:var(--ink); font-weight:600; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--c); }

  /* Detalles desplegables */
  .details{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease; }
  .card.open .details{ grid-template-rows:1fr; }
  .details-in{ overflow:hidden; min-height:0; }
  .details-pad{ padding:0 16px 16px; border-top:1px dashed var(--line); }
  .countdown{
    display:flex; align-items:center; gap:12px; margin:14px 0 6px; padding:12px 14px;
    border-radius:16px; background:color-mix(in srgb, var(--red) 10%, transparent);
  }
  .countdown strong{ font-family:var(--font-title); font-size:34px; line-height:1; color:var(--red); }
  .countdown span{ font-size:13.5px; font-weight:600; }
  .note{ margin:10px 0 2px; padding:10px 12px; border-radius:14px; background:var(--bg); }
  .note small{ color:var(--muted); font-size:12px; font-weight:600; }
  .note p{ margin:2px 0 0; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .rows{ list-style:none; margin:8px 0 0; padding:0; }
  .row{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:0; }
  .row .dot{ margin:0; width:10px; height:10px; }
  .row .l b{ display:block; font-size:14px; font-weight:600; }
  .row .l small{ color:var(--muted); font-size:12.5px; }
  .row .r{ font-size:13px; font-weight:600; text-align:right; }
  .money{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .money div{ background:var(--bg); border-radius:12px; padding:8px 10px; }
  .money small{ display:block; font-size:11.5px; color:var(--muted); }
  .money b{ font-size:13.5px; font-variant-numeric:tabular-nums; }
  .abono{ display:flex; gap:8px; margin-top:6px; }
  .abono input{ flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; font-size:16px; }
  .btn{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 14px; font-weight:600; font-size:14px; }
  .btn.primary{ background:var(--brand); color:#fff; border-color:transparent; }
  :root[data-theme="dark"] .btn.primary{ color:#0E1513; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{ color:#0E1513; } }
  .btn.good{ background:color-mix(in srgb, var(--green) 14%, transparent); color:var(--green); border-color:transparent; }
  .btn.danger{ color:var(--red); }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  .empty{ text-align:center; color:var(--muted); padding:40px 20px; }
  .empty .btn{ margin-top:12px; }

  /* Hojas (ediciÃ³n y movimientos) */
  .sheet{ position:fixed; inset:0; background:rgba(8,14,12,.55); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet[hidden]{ display:none; }
  .sheet-card{
    background:var(--surface); width:100%; max-width:560px; max-height:92%; overflow-y:auto;
    border-radius:26px 26px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    animation:up .25s ease;
  }
  @keyframes up{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
  .sheet h2{ font-family:var(--font-title); font-size:20px; margin:0 0 12px; }
  .field{ margin-bottom:12px; }
  .field label,.field .lbl{ display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .field small{ color:var(--muted); font-size:12px; display:block; margin-top:3px; }
  .field input,.field select,.field textarea{
    width:100%; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:11px 12px; font-size:16px;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input.title-in{ text-transform:uppercase; font-weight:700; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .err{ color:var(--red); font-size:13px; min-height:18px; margin:0 0 8px; }
  .sheet-actions{ display:flex; gap:8px; }
  .sheet-actions .btn{ flex:1; padding:12px; }

  .swatches{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .sw{ width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:var(--c); padding:0; display:grid; place-items:center; font-size:11px; font-weight:700; }
  .sw.auto{ background:var(--surface); color:var(--muted); }
  .sw[aria-pressed="true"]{ outline:3px solid var(--ink); outline-offset:2px; }
  .swatches input[type="color"]{ width:36px; height:32px; padding:0; border:0; background:none; border-radius:8px; }
  .sound-row{ display:flex; gap:8px; }
  .sound-row select{ flex:1; min-width:0; }
  .sound-row .btn{ flex:none; }
  .file-row[hidden]{ display:none; }
  .file-row input{ padding:9px 10px; font-size:14px; }

  /* Movimientos */
  .mv-total{ font-family:var(--font-title); font-size:30px; font-weight:800; margin:0 0 10px; font-variant-numeric:tabular-nums; }
  .mv-add{ display:grid; grid-template-columns:1fr 120px auto; gap:8px; margin-bottom:10px; }
  .mv-add input{ min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; font-size:16px; }
  .mv-list{ list-style:none; margin:0 0 12px; padding:0; max-height:36vh; overflow-y:auto; }
  .mv{ display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .mv b{ display:block; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
  .mv small{ color:var(--muted); font-size:12px; }
  .mv span{ font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
  .mv .x{ border:0; background:transparent; color:var(--muted); font-size:20px; line-height:1; padding:2px 6px; border-radius:8px; }
  .mv.auto .x{ visibility:hidden; }
  .mv-empty{ color:var(--muted); font-size:13.5px; padding:10px 0; }

  /* Permiso de notificaciones */
  .perm{ display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
  .perm-txt{ flex:1; min-width:0; }
  .perm-txt b{ display:block; font-size:14px; }
  .perm-txt span{ display:block; font-size:12.5px; color:var(--muted); line-height:1.3; }
  .perm-btns{ display:flex; flex-direction:column; gap:6px; flex:none; }
  .perm-btns .btn{ padding:7px 12px; font-size:13px; }

  /* Alerta a pantalla completa (por encima de todo) */
  .overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background:#8F1D1D; background:color-mix(in srgb, var(--red) 82%, #000);
    color:#fff; text-align:center; overflow-y:auto;
  }
  .overlay[hidden]{ display:none; }
  .ov-card{ width:100%; max-width:420px; }
  .ov-kicker{ margin:0; font-size:16px; font-weight:700; opacity:.92; }
  .ov-days{ display:flex; flex-direction:column; align-items:center; margin:8px 0 2px; line-height:1; }
  .ov-days b{ font-family:var(--font-title); font-weight:800; font-size:min(34vw, 150px); animation:ovPulse 1.6s ease-in-out infinite; }
  .ov-days span{ font-size:20px; font-weight:700; }
  .ov-title{ font-family:var(--font-title); font-size:26px; line-height:1.15; text-transform:uppercase; margin:16px 0 6px; overflow-wrap:anywhere; }
  .ov-text{ margin:0; font-size:17px; }
  .ov-amount{ margin:8px 0 0; font-size:16px; font-weight:700; }
  .ov-actions{ display:grid; gap:10px; margin-top:28px; }
  .ov-btn{ border:2px solid #fff; background:#fff; color:#8F1D1D; border-radius:16px; padding:15px; font-weight:800; font-size:17px; }
  .ov-btn.ghost{ background:transparent; color:#fff; }
  .ov-btn:focus-visible,.ov-link:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .ov-more{ margin:16px 0 0; font-size:13.5px; opacity:.92; }
  .ov-link{ border:0; background:none; color:#fff; text-decoration:underline; font-weight:700; padding:4px; }
  @keyframes ovPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  @media (prefers-reduced-motion: reduce){ .ov-days b{ animation:none; } }

  .toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:14px; font-size:14px; font-weight:600;
    max-width:min(92vw, 520px); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateX(-50%); pointer-events:auto; }

  @media (prefers-reduced-motion: reduce){
    .fill,.donut .arc,.details,.g-seg,.toast{ transition:none; }
    .sheet-card{ animation:none; }
  }
</style>
</head>
<body>
<div class="scroll" id="scroller">
 <div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1>Finanzas de Juan Hilario</h1>
      <button class="icon-btn" id="muteBtn" aria-label="Activar o silenciar avisos con sonido"></button>
      <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <p class="sub" id="today"></p>
    <div class="perm" id="perm"></div>
    <div class="stats" id="stats"></div>

    <div class="board">
      <div class="boxes">
        <button class="box income" id="incomeBox" aria-label="Ver y registrar ingresos"></button>
        <button class="box expense" id="expenseBox" aria-label="Ver y registrar gastos"></button>
      </div>
      <div class="gauge" id="gauge" role="img" aria-label="Balance de tus finanzas">
        <div class="gauge-ring">
          <svg viewBox="0 0 130 130">
            <circle class="g-bg" cx="65" cy="65" r="52"/>
            <circle class="g-seg" id="gOk" cx="65" cy="65" r="52" stroke="var(--green)" style="stroke-dasharray:0 327;stroke-dashoffset:0"/>
            <circle class="g-seg" id="gBad" cx="65" cy="65" r="52" stroke="var(--red)" style="stroke-dasharray:0 327;stroke-dashoffset:0"/>
          </svg>
          <div class="g-center"><b id="gState"></b><span id="gNet"></span></div>
        </div>
        <p class="g-msg" id="gMsg"></p>
      </div>
    </div>
  </header>

  <section class="sec">
    <h2>Mis obligaciones</h2>
    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      AÃ±adir
    </button>
  </section>

  <div class="tools">
    <div class="chips" id="chips"></div>
    <button class="sort" id="sortBtn"></button>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i style="background:var(--green)"></i>Corte</span>
    <span><i style="background:var(--yellow)"></i>Personal</span>
    <span><i style="background:var(--red)"></i>LÃ­mite</span>
  </div>

  <main class="list" id="list" aria-label="Lista de obligaciones"></main>
 </div>
</div>

<!-- Hoja: editar o aÃ±adir obligaciÃ³n -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Editar obligaciÃ³n</h2>
    <div class="field">
      <label for="fName">TÃ­tulo</label>
      <input id="fName" class="title-in" type="text" maxlength="60" autocomplete="off">
    </div>
    <div class="field">
      <span class="lbl">Color del tÃ­tulo</span>
      <div class="swatches" id="fColors"></div>
    </div>
    <div class="field">

<script>
(function(){
  'use strict';

  /* ---------- Datos iniciales ---------- */
  var SEED = [
    {name:'BANCO ADEMI',            type:'tarjeta',  cut:13,   personal:[15,30], limit:5},
    {name:'BANCO POPULAR',          type:'tarjeta',  cut:28,   personal:[15,30], limit:22},
    {name:'BANCO VIMENCA',          type:'tarjeta',  cut:10,   personal:[15,30], limit:2},
    {name:'BANCO APAP',             type:'tarjeta',  cut:21,   personal:[30],    limit:13},
    {name:'COOP ASPIRE',            type:'tarjeta',  cut:null, personal:[28,30], limit:5},
    {name:'BANCO QIK',              type:'tarjeta',  cut:15,   personal:[30],    limit:12},
    {name:'BANCO SANTA CRUZ',       type:'tarjeta',  cut:13,   personal:[30],    limit:9},
    {name:'PRÃ‰STAMO BANCO QIK',     type:'prestamo', cut:null, personal:[30],    limit:5},
    {name:'PRÃ‰STAMO COOP ASPIRÃ‰',   type:'prestamo', cut:null, personal:[30],    limit:5},
    {name:'CLARO CODETEL',          type:'servicio', cut:null, personal:[15,30], limit:2},
    {name:'VIVA',                   type:'servicio', cut:null, personal:[15],    limit:30}
  ];

  var KEY = 'obligaciones.v1';
  var KEY_MOV = 'finanzas.mov.v1';
  var KEY_LOG = 'finanzas.avisos.v1';
  var KEY_MUTE = 'finanzas.silencio';
  var THEME_KEY = 'obligaciones.tema';
  var DAY = 86400000;
  var TYPES = {tarjeta:'Tarjeta', prestamo:'PrÃ©stamo', servicio:'Servicio', general:'Pago general'};
  var COLORS = {cut:'var(--green)', personal:'var(--yellow)', limit:'var(--red)'};
  var LABELS = {cut:'Fecha de corte', personal:'Fecha personal', limit:'Fecha lÃ­mite de pago'};
  var PALETTE = ['#D63A3A','#F57C00','#E3A400','#1F9D5A','#00897B','#1E88E5','#4B57D8','#8E44AD','#E91E63'];

  var state = {
    items:[], moves:{income:[], expense:[]}, expanded:{}, filter:'all', sort:'urgencia',
    editingId:null, confirmDel:null, shown:{}, muted:false
  };

  function uid(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function norm(o){
    return {
      id:o.id || uid(), name:o.name || '', type:TYPES[o.type] ? o.type : 'general',
      cut:o.cut || null, personal:Array.isArray(o.personal) ? o.personal : [], limit:o.limit || 1,
      total:+o.total || 0, paid:+o.paid || 0, flag:!!o.flag,
      color:/^#[0-9a-f]{6}$/i.test(o.color || '') ? o.color : '', note:o.note || '',
      sound:o.sound || 'none', soundData:o.soundData || '', soundName:o.soundName || ''
    };
  }

  function readJSON(k){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function writeJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

  function save(){ return writeJSON(KEY, state.items); }
  function saveMoves(){ return writeJSON(KEY_MOV, state.moves); }

  var stored = readJSON(KEY);
  state.items = (Array.isArray(stored) ? stored : SEED).map(norm);
  var sm = readJSON(KEY_MOV);
  if(sm && Array.isArray(sm.income) && Array.isArray(sm.expense)) state.moves = sm;
  try{ state.muted = localStorage.getItem(KEY_MUTE) === '1'; }catch(e){}

  /* ---------- Utilidades ---------- */
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function today(){ return startOfDay(new Date()); }
  function dim(y,m){ return new Date(y, m+1, 0).getDate(); }
  function occ(y,m,day){ return new Date(y, m, Math.min(day, dim(y,m))); }
  function diffDays(a,b){ return Math.round((a - b) / DAY); }
  function fmtDate(d){ return d.toLocaleDateString('es-DO', {day:'numeric', month:'short'}).replace('.',''); }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function fromIso(s){ var p = String(s).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
  function rel(n){ return n === 0 ? 'hoy' : n === 1 ? 'maÃ±ana' : 'en ' + n + ' dÃ­as'; }
  var money = new Intl.NumberFormat('es-DO', {style:'currency', currency:'DOP'});
  var money0 = new Intl.NumberFormat('es-DO', {style:'currency', currency:'DOP', maximumFractionDigits:0});
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function num(v){
    var n = parseFloat(String(v).replace(/[^0-9.,-]/g,'').replace(/,/g,''));
    return isFinite(n) ? n : NaN;
  }
  function sum(arr){ return arr.reduce(function(a,b){ return a + (+b.amount || 0); }, 0); }
  function find(id){ return state.items.find(function(o){ return o.id === id; }); }

  /* ---------- CÃ¡lculos por obligaciÃ³n ---------- */
  function percent(o){
    if(o.total > 0) return Math.max(0, Math.min(100, Math.round((o.paid / o.total) * 100)));
    return o.flag ? 100 : 0;
  }

  function compute(o, t){
    var evs = [];
    for(var off = -2; off <= 2; off++){
      var base = new Date(t.getFullYear(), t.getMonth() + off, 1);
      var y = base.getFullYear(), m = base.getMonth();
      if(o.cut) evs.push({date:occ(y,m,o.cut), type:'cut', day:o.cut});
      (o.personal || []).forEach(function(d){ evs.push({date:occ(y,m,d), type:'personal', day:d}); });
      if(o.limit) evs.push({date:occ(y,m,o.limit), type:'limit', day:o.limit});
    }
    var pr = {limit:3, personal:2, cut:1};
    evs.sort(function(a,b){ return (a.date - b.date) || (pr[b.type] - pr[a.type]); });
    var idx = evs.findIndex(function(e){ return e.date >= t; });
    var next = evs[idx];
    var prev = null;
    for(var i = idx - 1; i >= 0; i--){ if(evs[i].date < next.date){ prev = evs[i]; break; } }
    var progress = 1;
    if(prev && next.date.getTime() !== t.getTime()){
      progress = (t - prev.date) / (next.date - prev.date);
    }
    progress = Math.max(0.03, Math.min(1, progress));
    function upcoming(type){ return evs.find(function(e){ return e.type === type && e.date >= t; }); }
    var limitEv = upcoming('limit');
    return {
      next: next, nextDays: diffDays(next.date, t), progress: progress,
      cut: upcoming('cut'), limit: limitEv,
      limitDays: limitEv ? diffDays(limitEv.date, t) : 9999,
      personal: (o.personal || []).map(function(d){
        var e = evs.find(function(x){ return x.type === 'personal' && x.day === d && x.date >= t; });
        return {day:d, date:e.date, days:diffDays(e.date, t)};
      })
    };
  }

  /* ---------- Totales del tablero ---------- */
  function paidOpen(){
    return state.items.reduce(function(a,o){ return a + (o.total > 0 ? Math.min(o.paid, o.total) : 0); }, 0);
  }
  function totals(){
    var income = sum(state.moves.income);
    var expense = sum(state.moves.expense) + paidOpen();
    var pending = state.items.reduce(function(a,o){ return a + (o.total > 0 ? Math.max(0, o.total - o.paid) : 0); }, 0);
    var available = income - expense;
    var net = available - pending;
    var cov = pending > 0 ? Math.max(0, Math.min(1, available / pending)) : (available >= 0 ? 1 : 0);
    return {income:income, expense:expense, pending:pending, available:available, net:net, cov:cov,
            hasData:(income > 0 || expense > 0 || pending > 0)};
  }

  /* ---------- Sonidos ---------- */
  var actx = null;
  function ctx(){
    if(!actx){ var A = window.AudioContext || window.webkitAudioContext; if(A){ try{ actx = new A(); }catch(e){} } }
    if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  var TONES = {
    campana:{label:'Campana', n:[[880,0,1.2,'sine',.35],[1320,0,.9,'sine',.18],[1760,0,.6,'sine',.08]]},
    moneda: {label:'Moneda',  n:[[988,0,.09,'square',.12],[1319,.09,.5,'square',.12]]},
    alarma: {label:'Alarma',  n:[[880,0,.18,'square',.14],[880,.28,.18,'square',.14],[880,.56,.18,'square',.14],[1175,.84,.4,'square',.14]]},
    suave:  {label:'Suave',   n:[[523,0,.35,'sine',.25],[659,.18,.35,'sine',.25],[784,.36,.6,'sine',.25]]},
    pulso:  {label:'Pulso',   n:[[440,0,.25,'triangle',.3],[440,.35,.25,'triangle',.3],[554,.7,.5,'triangle',.3]]}
  };
  function playBuiltIn(key){
    var c = ctx(), tone = TONES[key];
    if(!c || !tone) return;
    var t0 = c.currentTime + 0.02;
    tone.n.forEach(function(n){
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = n[3]; osc.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0 + n[1]);
      g.gain.exponentialRampToValueAtTime(n[4], t0 + n[1] + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0 + n[1]); osc.stop(t0 + n[1] + n[2] + 0.05);
    });
  }
  function playSound(o){
    if(!o || !o.sound || o.sound === 'none') return;
    if(o.sound === 'custom'){
      if(!o.soundData) return;
      try{ var a = new Audio(o.soundData); var p = a.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
      return;
    }
    playBuiltIn(o.sound);
  }
  function soundLabel(o){ return o.sound === 'custom' ? (o.soundName || 'Mi audio') : (TONES[o.sound] ? TONES[o.sound].label : ''); }

  /* ---------- Aviso emergente ---------- */
  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 3500);
  }
  toastEl.addEventListener('click', function(){ toastEl.classList.remove('show'); });

  /* ---------- Avisos: notificaciÃ³n, sonido, vibraciÃ³n y alerta a pantalla completa ---------- */
  var ALERT_DAYS = 2;
  var KEY_NOTI = 'finanzas.noti.v2', KEY_ACK = 'finanzas.ack.v1';
  var unlocked = false, pendingRing = null;
  var alertQueue = [], overlayItem = null;
  var ov = document.getElementById('overlay');
  var inertEls = [document.getElementById('scroller'), document.getElementById('sheet'), document.getElementById('mvSheet')];

  function permState(){ return ('Notification' in window) ? Notification.permission : 'unsupported'; }

  function vibrate(){
    try{ if(!state.muted && navigator.vibrate) navigator.vibrate([400,150,400,150,800]); }catch(e){}
  }
  function ring(o){
    if(state.muted) return;
    if(!unlocked){ pendingRing = o; return; }
    playSound(o && o.sound && o.sound !== 'none' ? o : {sound:'campana'});
  }
  function unlock(){
    if(unlocked) return;
    unlocked = true; ctx();
    if(pendingRing){ var p = pendingRing; pendingRing = null; ring(p); vibrate(); }
  }
  document.addEventListener('pointerdown', unlock, {once:true});
  document.addEventListener('keydown', unlock, {once:true});

  function notify(title, body, tag){
    if(permState() !== 'granted') return false;
    try{
      var n = new Notification(title, {body:body, tag:tag, renotify:true, requireInteraction:true, vibrate:[400,150,400,150,800]});
      n.onclick = function(){ try{ window.focus(); n.close(); }catch(e){} };
      return true;
    }catch(e){ return false; }
  }

  function eventText(e){
    var lbl = e.type === 'limit' ? 'Fecha lÃ­mite de pago' : (e.type === 'cut' ? 'Fecha de corte' : 'Fecha personal');
    return lbl + ' ' + rel(e.days) + ' (' + fmtDate(e.date) + ')';
  }

  function collectDue(){
    var t = today(), res = {events:[], limits:[]};
    state.items.forEach(function(o){
      if(percent(o) >= 100) return;
      var m = compute(o, t);
      if(o.cut && m.cut){
        var dc = diffDays(m.cut.date, t);
        if(dc >= 0 && dc <= ALERT_DAYS) res.events.push({o:o, type:'cut', date:m.cut.date, days:dc});
      }
      m.personal.forEach(function(p){
        if(p.days >= 0 && p.days <= ALERT_DAYS) res.events.push({o:o, type:'personal', date:p.date, days:p.days});
      });
      if(m.limit && m.limitDays >= 0 && m.limitDays <= ALERT_DAYS){
        res.limits.push({o:o, type:'limit', date:m.limit.date, days:m.limitDays});
      }
    });
    return res;
  }

  function checkAlerts(){
    var due = collectDue(), t = today();
    var log = readJSON(KEY_NOTI) || {}, ack = readJSON(KEY_ACK) || {};
    var cutoff = iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 60));
    var dirty = false, ackDirty = false, fresh = [];
    Object.keys(log).forEach(function(k){ if(k.split('|')[2] < cutoff){ delete log[k]; dirty = true; } });
    Object.keys(ack).forEach(function(k){ if(k.split('|')[1] < cutoff){ delete ack[k]; ackDirty = true; } });
    if(ackDirty) writeJSON(KEY_ACK, ack);

    due.events.concat(due.limits).forEach(function(e){
      var k = e.o.id + '|' + e.type + '|' + iso(e.date);
      if(!log[k]){ log[k] = 1; dirty = true; fresh.push(e); }
    });
    if(dirty) writeJSON(KEY_NOTI, log);

    /* NotificaciÃ³n en la barra, sonido y vibraciÃ³n (corte, personal y lÃ­mite) */
    var fallback = [], rang = 0;
    fresh.forEach(function(e){
      var ok = notify(e.o.name, eventText(e), e.o.id + e.type);
      if(!ok && e.type !== 'limit') fallback.push(e.o.name + ': ' + eventText(e));
      if(e.type !== 'limit'){
        (function(item, delay){ setTimeout(function(){ ring(item.o); }, delay); })(e, rang * 2300);
        rang++;
      }
    });
    if(rang) vibrate();
    if(fallback.length) toast('Aviso: ' + fallback.join(' Â· '), 7000);

    /* Alerta a pantalla completa para la fecha lÃ­mite, hasta que se confirme */
    due.limits.forEach(function(e){
      var key = e.o.id + '|' + iso(e.date);
      if(ack[key]) return;
      if(overlayItem && overlayItem.key === key) return;
      if(alertQueue.some(function(q){ return q.key === key; })) return;
      alertQueue.push({key:key, id:e.o.id, o:e.o, date:e.date, days:e.days});
    });
    if(!overlayItem && alertQueue.length) showNextOverlay();
  }

  function setInert(on){ inertEls.forEach(function(el){ if(el) el.inert = on; }); }
  function closeOverlay(){
    overlayItem = null; ov.hidden = true; ov.innerHTML = ''; setInert(false);
  }
  function ackItem(it){
    if(!it || it.preview) return;
    var ack = readJSON(KEY_ACK) || {};
    ack[it.key] = 1; writeJSON(KEY_ACK, ack);
  }

  function showNextOverlay(){
    var item = alertQueue.shift();
    if(!item){ closeOverlay(); return; }
    overlayItem = item;
    var o = item.o;
    var days = item.preview ? item.days : Math.max(0, diffDays(item.date, today()));
    var pend = o.total > 0 ? Math.max(0, o.total - o.paid) : 0;
    var more = alertQueue.length;
    var text = days === 0 ? 'Hoy es el Ãºltimo dÃ­a para pagar'
             : (days === 1 ? 'Falta 1 dÃ­a para el lÃ­mite de pago' : 'Faltan ' + days + ' dÃ­as para el lÃ­mite de pago');
    ov.innerHTML =
      '<div class="ov-card">' +
        '<p class="ov-kicker">Fecha lÃ­mite de pago</p>' +
        '<div class="ov-days"><b>' + days + '</b><span>' + (days === 1 ? 'dÃ­a' : 'dÃ­as') + '</span></div>' +
        '<h2 class="ov-title" id="ovTitle">' + esc(o.name) + '</h2>' +
        '<p class="ov-text">' + text + ' Â· ' + fmtDate(item.date) + '</p>' +
        (pend > 0 ? '<p class="ov-amount">Pendiente: ' + money.format(pend) + '</p>' : '') +
        '<div class="ov-actions">' +
          '<button class="ov-btn" data-ov="ok" id="ovOk">Entendido</button>' +
          (item.preview ? '' : '<button class="ov-btn ghost" data-ov="paid">Ya paguÃ©</button>') +
        '</div>' +
        (more > 0 ? '<p class="ov-more">Quedan ' + more + (more === 1 ? ' alerta mÃ¡s' : ' alertas mÃ¡s') +
          ' Â· <button class="ov-link" data-ov="all">Entendido todas</button></p>' : '') +
      '</div>';
    ov.hidden = false;
    setInert(true);
    setTimeout(function(){ var b = document.getElementById('ovOk'); if(b) b.focus(); }, 30);
    ring(o); vibrate();
  }

  ov.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-ov]');
    if(!b || !overlayItem) return;
    var act = b.getAttribute('data-ov'), it = overlayItem;
    if(act === 'all'){
      ackItem(it); alertQueue.forEach(ackItem); alertQueue = []; closeOverlay(); return;
    }
    if(act === 'paid' && !it.preview){
      var o = find(it.id);
      if(o){ o.flag = true; if(o.total > 0) o.paid = o.total; save(); render(); }
    }
    ackItem(it);
    showNextOverlay();
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape' && overlayItem){
      var b = ov.querySelector('[data-ov="ok"]'); if(b) b.click();
    }
  });

  /* ---------- Permiso y pruebas ---------- */
  function paintPerm(){
    var el = document.getElementById('perm'), p = permState(), h = '';
    if(p === 'granted'){
      h = '<div class="perm-txt"><b>Notificaciones activadas</b><span>Llegan 2 dÃ­as antes mientras la app estÃ© abierta, aunque sea en segundo plano.</span></div>' +
          '<div class="perm-btns"><button class="btn" data-perm="test">Probar aviso</button><button class="btn" data-perm="overlay">Probar alerta</button></div>';
    }else if(p === 'denied'){
      h = '<div class="perm-txt"><b>Notificaciones bloqueadas</b><span>Si abriste la app dentro de Claude, Ã¡brela en el navegador y permite las notificaciones. Mientras tanto verÃ¡s los avisos dentro de la app.</span></div>' +
          '<div class="perm-btns"><button class="btn" data-perm="overlay">Probar alerta</button></div>';
    }else if(p === 'unsupported'){
      h = '<div class="perm-txt"><b>Sin notificaciones del sistema</b><span>Este navegador no las permite. VerÃ¡s los avisos y la alerta dentro de la app.</span></div>' +
          '<div class="perm-btns"><button class="btn" data-perm="overlay">Probar alerta</button></div>';

    if(cutRaw){ cut = parseInt(cutRaw, 10); if(!validDay(cut)){ F.err.textContent = 'El dÃ­a de corte debe estar entre 1 y 31.'; return; } }
    var limit = parseInt(F.limit.value.trim(), 10);
    if(!validDay(limit)){ F.err.textContent = 'Indica el dÃ­a lÃ­mite de pago, entre 1 y 31.'; return; }
    var personal = [];
    var parts = F.personal.value.split(/[,\s-]+/).filter(Boolean);
    for(var i = 0; i < parts.length; i++){
      var d = parseInt(parts[i], 10);
      if(!validDay(d)){ F.err.textContent = 'Los dÃ­as personales deben estar entre 1 y 31.'; return; }
      if(personal.indexOf(d) === -1) personal.push(d);
    }
    personal.sort(function(a,b){ return a - b; });
    var total = F.total.value.trim() ? num(F.total.value) : 0;
    var paid = F.paid.value.trim() ? num(F.paid.value) : 0;
    if(isNaN(total) || total < 0 || isNaN(paid) || paid < 0){ F.err.textContent = 'Los montos deben ser nÃºmeros positivos.'; return; }
    if(total > 0 && paid > total) paid = total;
    var sound = F.sound.value;
    if(sound === 'custom' && !sheetSoundData){ F.err.textContent = 'Elige un archivo de audio o selecciona otro sonido.'; return; }

    var data = {
      name:name, type:F.type.value, cut:cut, personal:personal, limit:limit, total:total, paid:paid,
      color:sheetColor, note:F.note.value.trim(), sound:sound,
      soundData: sound === 'custom' ? sheetSoundData : '', soundName: sound === 'custom' ? sheetSoundName : ''
    };
    if(state.editingId){
      var o = find(state.editingId);
      Object.keys(data).forEach(function(k){ o[k] = data[k]; });
      if(total > 0) o.flag = paid >= total;
    }else{
      var n = norm(data);
      state.items.unshift(n);
      state.expanded[n.id] = true;
    }
    if(!save()){
      var target = state.editingId ? find(state.editingId) : state.items[0];
      if(target.soundData){
        target.sound = 'none'; target.soundData = ''; target.soundName = '';
        save();
        toast('El audio no cupo en el almacenamiento. Se guardÃ³ sin sonido propio.', 5000);
      }
    }
    closeSheet(); render();
  }

  document.getElementById('addBtn').addEventListener('click', function(){ openSheet(null); });
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('saveBtn').addEventListener('click', saveSheet);
  sheet.addEventListener('click', function(ev){ if(ev.target === sheet) closeSheet(); });
  sheet.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type === 'text') saveSheet(); });

  /* ---------- Ingresos y gastos ---------- */
  var mvSheet = document.getElementById('mvSheet');
  var mvKind = null, mvConfirm = false;
  var MV = {
    title: document.getElementById('mvTitle'), total: document.getElementById('mvTotal'),
    concept: document.getElementById('mvConcept'), amount: document.getElementById('mvAmount'),
    err: document.getElementById('mvErr'), list: document.getElementById('mvList'),
    clear: document.getElementById('mvClearBtn')
  };

  function renderMv(){
    var arr = state.moves[mvKind];
    var isExp = mvKind === 'expense';
    var po = isExp ? paidOpen() : 0;
    MV.total.textContent = money.format(sum(arr) + po);
    MV.total.style.color = isExp ? 'var(--red)' : 'var(--green)';
    var html = '';
    if(isExp && po > 0){
      html += '<li class="mv auto"><div><b>Pagos a obligaciones</b><small>Abonos del ciclo actual (automÃ¡tico)</small></div><span>' + money.format(po) + '</span><button class="x" tabindex="-1" aria-hidden="true">Ã—</button></li>';
    }
    arr.slice().reverse().forEach(function(m){
      html += '<li class="mv"><div><b>' + esc(m.concept) + '</b><small>' + fmtDate(fromIso(m.date)) + '</small></div>' +
        '<span>' + money.format(m.amount) + '</span>' +
        '<button class="x" data-del="' + m.id + '" aria-label="Borrar ' + esc(m.concept) + '">Ã—</button></li>';
    });
    if(!html) html = '<li class="mv-empty">' + (isExp ? 'AÃºn no has registrado gastos.' : 'AÃºn no has registrado ingresos.') + '</li>';
    MV.list.innerHTML = html;
    MV.clear.textContent = mvConfirm ? 'Toca otra vez para vaciar' : 'Vaciar lista';
  }
  function openMv(kind){
    mvKind = kind; mvConfirm = false;
    MV.title.textContent = kind === 'income' ? 'Ingresos' : 'Gastos';
    MV.concept.value = ''; MV.amount.value = ''; MV.err.textContent = '';
    MV.concept.placeholder = kind === 'income' ? 'Concepto (ej. Salario)' : 'Concepto (ej. Comida)';
    renderMv();
    mvSheet.hidden = false;
    setTimeout(function(){ MV.amount.focus(); }, 50);
  }
  function closeMv(){ mvSheet.hidden = true; mvKind = null; }
  function addMv(){
    var v = num(MV.amount.value);
    if(!(v > 0)){ MV.err.textContent = 'Escribe un monto mayor que cero.'; MV.amount.focus(); return; }
    var concept = MV.concept.value.trim() || (mvKind === 'income' ? 'Ingreso' : 'Gasto');
    state.moves[mvKind].push({id:uid(), concept:concept, amount:v, date:iso(today())});
    saveMoves();
    MV.concept.value = ''; MV.amount.value = ''; MV.err.textContent = ''; mvConfirm = false;
    renderMv(); render();
    MV.amount.focus();
  }

  document.getElementById('incomeBox').addEventListener('click', function(){ openMv('income'); });
  document.getElementById('expenseBox').addEventListener('click', function(){ openMv('expense'); });
  document.getElementById('mvAddBtn').addEventListener('click', addMv);
  document.getElementById('mvCloseBtn').addEventListener('click', closeMv);
  mvSheet.addEventListener('click', function(ev){ if(ev.target === mvSheet) closeMv(); });
  mvSheet.addEventListener('keydown', function(ev){ if(ev.key === 'Enter' && ev.target.tagName === 'INPUT') addMv(); });
  MV.list.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-del]');
    if(!b) return;
    var id = b.getAttribute('data-del');
    state.moves[mvKind] = state.moves[mvKind].filter(function(m){ return m.id !== id; });
    saveMoves(); renderMv(); render();
  });
  MV.clear.addEventListener('click', function(){
    if(!mvConfirm){ mvConfirm = true; renderMv(); return; }
    state.moves[mvKind] = []; mvConfirm = false;
    saveMoves(); renderMv(); render();
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key !== 'Escape') return;
    if(!sheet.hidden) closeSheet();
    if(!mvSheet.hidden) closeMv();
  });

  /* ---------- Tema ---------- */
  function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme', t); }
  try{ applyTheme(localStorage.getItem(THEME_KEY)); }catch(e){}
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    if(!cur){ cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    var nxt = cur === 'dark' ? 'light' : 'dark';
    applyTheme(nxt);
    try{ localStorage.setItem(THEME_KEY, nxt); }catch(e){}
  });

  /* ---------- Refresco al cambiar de dÃ­a ---------- */
  var lastKey = iso(today());
  function dayCheck(){
    var k = iso(today());
    if(k !== lastKey){ lastKey = k; render(); }
    checkAlerts();
  }
  setInterval(dayCheck, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) dayCheck(); });

  paintMute();
  render();
  paintPerm();
  checkAlerts();
})();
</script>
</body>
</html>
