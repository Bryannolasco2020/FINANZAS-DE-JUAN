<script>

/*
 * =========================================================
 * UTILIDADES DE FECHAS
 * =========================================================
 */

function parseDateOnly(dateString) {

    if (!dateString) {
        return null;
    }

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return null;
    }

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2]),
        12,
        0,
        0,
        0
    );

}


function formatDate(dateString) {

    const date =
        parseDateOnly(dateString);

    if (!date) {
        return "Sin fecha";
    }

    return date.toLocaleDateString(
        "es-DO",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


function getDateDifferenceInDays(
    dateString
) {

    const target =
        parseDateOnly(dateString);

    if (!target) {
        return null;
    }

    const now =
        new Date();

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            12,
            0,
            0,
            0
        );

    const difference =
        target.getTime() -
        today.getTime();

    return Math.ceil(
        difference /
        (1000 * 60 * 60 * 24)
    );

}


/*
 * =========================================================
 * DETERMINAR ESTADO DE UNA OBLIGACIÓN
 *
 * VERDE:
 * Todavía falta suficiente tiempo.
 *
 * AMARILLO:
 * Se acerca la fecha personal.
 *
 * ROJO:
 * Se acerca la fecha límite de pago.
 * =========================================================
 */

function getObligationStatus(
    obligation
) {

    const cutoffDays =
        getDateDifferenceInDays(
            obligation.cutoffDate
        );

    const personalDays =
        getDateDifferenceInDays(
            obligation.personalDate
        );

    const paymentDays =
        getDateDifferenceInDays(
            obligation.paymentDate
        );


    /*
     * La fecha límite de pago
     * tiene la prioridad más alta.
     */

    if (
        paymentDays !== null &&
        paymentDays <= 2
    ) {

        return "red";

    }


    /*
     * Si la fecha de pago ya pasó,
     * permanece en rojo.
     */

    if (
        paymentDays !== null &&
        paymentDays < 0
    ) {

        return "red";

    }


    /*
     * Fecha personal cercana.
     */

    if (
        personalDays !== null &&
        personalDays <= 2
    ) {

        return "yellow";

    }


    /*
     * Si ya pasó la fecha personal
     * pero todavía no llega el pago,
     * también mostramos amarillo.
     */

    if (
        personalDays !== null &&
        personalDays < 0
    ) {

        return "yellow";

    }


    /*
     * Fecha de corte cercana.
     */

    if (
        cutoffDays !== null &&
        cutoffDays <= 2
    ) {

        return "yellow";

    }


    return "green";

}


/*
 * =========================================================
 * TEXTO DE DÍAS RESTANTES
 * =========================================================
 */

function getDaysRemainingText(
    dateString,
    label
) {

    const days =
        getDateDifferenceInDays(
            dateString
        );


    if (days === null) {

        return `
            <span class="detail-value">
                Sin fecha
            </span>
        `;

    }


    if (days === 0) {

        return `
            <span class="detail-value"
                  style="color:var(--red);">
                ${escapeHTML(label)}: HOY
            </span>
        `;

    }


    if (days === 1) {

        return `
            <span class="detail-value"
                  style="color:var(--red);">
                ${escapeHTML(label)}: falta 1 día
            </span>
        `;

    }


    if (days < 0) {

        const overdue =
            Math.abs(days);

        return `
            <span class="detail-value"
                  style="color:var(--red);">
                ${escapeHTML(label)}:
                vencida hace ${overdue}
                ${overdue === 1 ? "día" : "días"}
            </span>
        `;

    }


    return `
        <span class="detail-value">
            ${escapeHTML(label)}:
            ${days} días restantes
        </span>
    `;

}


/*
 * =========================================================
 * TEXTO GENERAL DEL ESTADO
 * =========================================================
 */

function getStatusMessage(
    obligation
) {

    const paymentDays =
        getDateDifferenceInDays(
            obligation.paymentDate
        );

    const personalDays =
        getDateDifferenceInDays(
            obligation.personalDate
        );

    const cutoffDays =
        getDateDifferenceInDays(
            obligation.cutoffDate
        );


    if (
        paymentDays !== null &&
        paymentDays < 0
    ) {

        const days =
            Math.abs(paymentDays);

        return `
            ⚠️ Pago vencido hace
            ${days}
            ${days === 1 ? "día" : "días"}.
        `;

    }


    if (
        paymentDays !== null &&
        paymentDays === 0
    ) {

        return `
            🔴 La fecha límite de pago es hoy.
        `;

    }


    if (
        paymentDays !== null &&
        paymentDays <= 2
    ) {

        return `
            🔴 La fecha límite de pago
            está muy próxima.
        `;

    }


    if (
        personalDays !== null &&
        personalDays <= 2
    ) {

        return `
            🟡 Tu fecha personal
            está próxima.
        `;

    }


    if (
        cutoffDays !== null &&
        cutoffDays <= 2
    ) {

        return `
            🟡 La fecha de corte
            está próxima.
        `;

    }


    return `
        🟢 Todo bajo control.
        Mantén el seguimiento.
    `;

}
