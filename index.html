<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas de Juan Hilario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#E9EEEC; --surface:#FFFFFF; --ink:#13201D; --muted:#5C6B67; --line:#DCE4E1; --brand:#4B57D8; --green:#1F9D5A; --yellow:#E3A400; --red:#D63A3A; --track:#E3EAE7; --shadow:0 1px 2px rgba(19,32,29,.06), 0 8px 24px -12px rgba(19,32,29,.18); --font-title:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1513; --surface:#17211E; --ink:#EAF2EF; --muted:#93A59F; --line:#26332F; --brand:#8C96FF; --green:#3DC47E; --yellow:#F2BC2B; --red:#F26464; --track:#24312D; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7); } }
:root[data-theme="dark"]{ --bg:#0E1513; --surface:#17211E; --ink:#EAF2EF; --muted:#93A59F; --line:#26332F; --brand:#8C96FF; --green:#3DC47E; --yellow:#F2BC2B; --red:#F26464; --track:#24312D; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7); }
html{ scroll-padding-top:env(safe-area-inset-top, 0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
.scroll{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.wrap{ max-width:560px; margin:0 auto; padding-bottom:32px; }
.top{ padding:16px 16px 4px; }
.top-row{ display:flex; align-items:flex-start; gap:10px; }
.top h1{ font-family:var(--font-title); font-weight:800; font-size:23px; line-height:1.12; margin:0; flex:1; letter-spacing:.005em; text-transform:uppercase; padding-top:2px; }
.sub{ margin:4px 0 0; color:var(--muted); font-size:13px; text-transform:capitalize; }
.icon-btn{ width:42px; height:42px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none; }
.icon-btn svg{ width:20px; height:20px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 12px; }
.stat b{ display:block; font-family:var(--font-title); font-size:22px; font-weight:700; line-height:1.1; }
.stat span{ font-size:12px; color:var(--muted); }
.board{ display:grid; grid-template-columns:1fr 158px; gap:8px; margin-top:8px; align-items:stretch; }
.boxes{ display:grid; grid-template-rows:1fr 1fr; gap:8px; }
.box{ position:relative; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:10px 12px 10px 16px; display:flex; flex-direction:column; justify-content:center; min-width:0; cursor:pointer; }
.box::before{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:0 4px 4px 0; background:var(--c); }
.box small{ color:var(--muted); font-size:12px; }
.box b{ font-family:var(--font-title); font-size:19px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; color:var(--c); }
.box em{ font-style:normal; font-size:11.5px; color:var(--muted); }
.box.income{ --c:var(--green); }
.box.expense{ --c:var(--red); }
.gauge{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 8px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; }
.gauge-ring{ position:relative; width:122px; height:122px; flex:none; }
.gauge-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.gauge-ring circle{ fill:none; stroke-width:14; }
.g-bg{ stroke:var(--track); }
.g-seg{ transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1), stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.g-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 22px; }
.g-center b{ font-size:12.5px; font-weight:700; }
.g-center span{ font-family:var(--font-title); font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; }
.g-msg{ margin:6px 0 0; font-size:11.5px; line-height:1.3; color:var(--muted); }
.sec{ display:flex; align-items:center; gap:10px; padding:26px 16px 8px; }
.sec h2{ font-family:var(--font-title); font-weight:800; font-size:21px; margin:0; flex:1; }
.add-btn{ display:flex; align-items:center; gap:6px; border:0; background:var(--brand); color:#fff; border-radius:14px; padding:9px 14px; font-weight:700; font-size:14px; }
.add-btn svg{ width:16px; height:16px; }
:root[data-theme="dark"] .add-btn{ color:#0E1513; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .add-btn{ color:#0E1513; } }
.tools{ display:flex; align-items:center; gap:8px; padding:4px 16px 8px; }
.chips{ display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px 0; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; color:var(--muted); }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.sort{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; }
.list{ padding:4px 16px 8px; display:flex; flex-direction:column; gap:12px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); flex:none; }
.head{ display:flex; align-items:center; gap:12px; padding:14px 14px 10px 16px; cursor:pointer; border-radius:22px; }
.head-main{ flex:1; min-width:0; }
.title-row{ display:flex; align-items:center; gap:6px; }
.title{ margin:0; font-family:var(--font-title); font-weight:700; font-size:17px; line-height:1.2; text-transform:uppercase; overflow-wrap:anywhere; letter-spacing:.01em; }
.edit{ border:0; background:transparent; padding:4px; border-radius:8px; color:var(--muted); flex:none; display:grid; }
.edit svg{ width:16px; height:16px; }
.meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.pill{ font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--track); color:var(--muted); }
.pill.red{ background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red); }
.pill.yellow{ background:color-mix(in srgb, var(--yellow) 22%, transparent); color:color-mix(in srgb, var(--yellow) 70%, var(--ink)); }
.pill.green{ background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }
.donut{ position:relative; width:64px; height:64px; flex:none; }
.donut svg{ width:100%; height:100%; transform:rotate(-90deg); }
.donut .bg{ stroke:var(--track); }
.donut .arc{ stroke:var(--brand); transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.donut.full .arc{ stroke:var(--green); }
.donut .num{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--font-title); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
.donut .num small{ font-size:10px; font-weight:600; margin-left:1px; color:var(--muted); align-self:center; }
.donut .num span{ display:flex; align-items:baseline; }
.progress{ padding:0 16px 14px; }
.bar{ height:10px; border-radius:999px; background:var(--track); overflow:hidden; }
.fill{ height:100%; width:0; border-radius:inherit; background:var(--c); transition:width 1s cubic-bezier(.2,.8,.2,1); }
.bar-info{ display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:12.5px; color:var(--muted); }
.bar-info b{ color:var(--ink); font-weight:600; }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--c); }
.details{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease; }
.card.open .details{ grid-template-rows:1fr; }
.details-in{ overflow:hidden; min-height:0; }
.details-pad{ padding:0 16px 16px; border-top:1px dashed var(--line); }
.countdown{ display:flex; align-items:center; gap:12px; margin:14px 0 6px; padding:12px 14px; border-radius:16px; background:color-mix(in srgb, var(--red) 10%, transparent); }
.countdown strong{ font-family:var(--font-title); font-size:34px; line-height:1; color:var(--red); }
.countdown span{ font-size:13.5px; font-weight:600; }
.note{ margin:10px 0 2px; padding:10px 12px; border-radius:14px; background:var(--bg); }
.note small{ color:var(--muted); font-size:12px; font-weight:600; }
.note p{ margin:2px 0 0; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
.rows{ list-style:none; margin:8px 0 0; padding:0; }
.row{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
.row:last-child{ border-bottom:0; }
.row .dot{ margin:0; width:10px; height:10px; }
.row .l b{ display:block; font-size:14px; font-weight:600; }
.row .l small{ color:var(--muted); font-size:12.5px; }
.row .r{ font-size:13px; font-weight:600; text-align:right; }
.money{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.money div{ background:var(--bg); border-radius:12px; padding:8px 10px; }
.money small{ display:block; font-size:11.5px; color:var(--muted); }
.money b{ font-size:13.5px; font-variant-numeric:tabular-nums; }
.abono{ display:flex; gap:8px; margin-top:6px; }
.abono input{ flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; font-size:16px; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 14px; font-weight:600; font-size:14px; }
.btn.primary{ background:var(--brand); color:#fff; border-color:transparent; }
:root[data-theme="dark"] .btn.primary{ color:#0E1513; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{ color:#0E1513; } }
.btn.good{ background:color-mix(in srgb, var(--green) 14%, transparent); color:var(--green); border-color:transparent; }
.btn.danger{ color:var(--red); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.empty{ text-align:center; color:var(--muted); padding:40px 20px; }
.empty .btn{ margin-top:12px; }
.sheet{ position:fixed; inset:0; background:rgba(8,14,12,.55); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
.sheet[hidden]{ display:none; }
.sheet-card{ background:var(--surface); width:100%; max-width:560px; max-height:92%; overflow-y:auto; border-radius:26px 26px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation:up .25s ease; }
@keyframes up{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet h2{ font-family:var(--font-title); font-size:20px; margin:0 0 12px; }
.field{ margin-bottom:12px; }
.field label,.field .lbl{ display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
.field small{ color:var(--muted); font-size:12px; display:block; margin-top:3px; }
.field input,.field select,.field textarea{ width:100%; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:11px 12px; font-size:16px; }
.field textarea{ resize:vertical; min-height:70px; }
.field input.title-in{ text-transform:uppercase; font-weight:700; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.err{ color:var(--red); font-size:13px; min-height:18px; margin:0 0 8px; }
.sheet-actions{ display:flex; gap:8px; }
.sheet-actions .btn{ flex:1; padding:12px; }
.swatches{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.sw{ width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:var(--c); padding:0; display:grid; place-items:center; font-size:11px; font-weight:700; }
.sw.auto{ background:var(--surface); color:var(--muted); }
.sw[aria-pressed="true"]{ outline:3px solid var(--ink); outline-offset:2px; }
.swatches input[type="color"]{ width:36px; height:32px; padding:0; border:0; background:none; border-radius:8px; }
.sound-row{ display:flex; gap:8px; }
.sound-row select{ flex:1; min-width:0; }
.sound-row .btn{ flex:none; }
.file-row[hidden]{ display:none; }
.file-row input{ padding:9px 10px; font-size:14px; }
.mv-total{ font-family:var(--font-title); font-size:30px; font-weight:800; margin:0 0 10px; font-variant-numeric:tabular-nums; }
.mv-add{ display:grid; grid-template-columns:1fr 120px auto; gap:8px; margin-bottom:10px; }
.mv-add input{ min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; font-size:16px; }
.mv-list{ list-style:none; margin:0 0 12px; padding:0; max-height:36vh; overflow-y:auto; }
.mv{ display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
.mv b{ display:block; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
.mv small{ color:var(--muted); font-size:12px; }
.mv span{ font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
.mv .x{ border:0; background:transparent; color:var(--muted); font-size:20px; line-height:1; padding:2px 6px; border-radius:8px; }
.mv.auto .x{ visibility:hidden; }
.mv-empty{ color:var(--muted); font-size:13.5px; padding:10px 0; }
.perm{ display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
.perm-txt{ flex:1; min-width:0; }
.perm-txt b{ display:block; font-size:14px; }
.perm-txt span{ display:block; font-size:12.5px; color:var(--muted); line-height:1.3; }
.perm-btns{ display:flex; flex-direction:column; gap:6px; flex:none; }
.perm-btns .btn{ padding:7px 12px; font-size:13px; }
.overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); background:#8F1D1D; background:color-mix(in srgb, var(--red) 82%, #000); color:#fff; text-align:center; overflow-y:auto; }
.overlay[hidden]{ display:none; }
.ov-card{ width:100%; max-width:420px; }
.ov-kicker{ margin:0; font-size:16px; font-weight:700; opacity:.92; }
.ov-days{ display:flex; flex-direction:column; align-items:center; margin:8px 0 2px; line-height:1; }
.ov-days b{ font-family:var(--font-title); font-weight:800; font-size:min(34vw, 150px); animation:ovPulse 1.6s ease-in-out infinite; }
.ov-days span{ font-size:20px; font-weight:700; }
.ov-title{ font-family:var(--font-title); font-size:26px; line-height:1.15; text-transform:uppercase; margin:16px 0 6px; overflow-wrap:anywhere; }
.ov-text{ margin:0; font-size:17px; }
.ov-amount{ margin:8px 0 0; font-size:16px; font-weight:700; }
.ov-actions{ display:grid; gap:10px; margin-top:28px; }
.ov-btn{ border:2px solid #fff; background:#fff; color:#8F1D1D; border-radius:16px; padding:15px; font-weight:800; font-size:17px; }
.ov-btn.ghost{ background:transparent; color:#fff; }
.ov-btn:focus-visible,.ov-link:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
.ov-more{ margin:16px 0 0; font-size:13.5px; opacity:.92; }
.ov-link{ border:0; background:none; color:#fff; text-decoration:underline; font-weight:700; padding:4px; }
@keyframes ovPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@media (prefers-reduced-motion: reduce){ .ov-days b{ animation:none; } }
.toast{ position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:14px; font-size:14px; font-weight:600; max-width:min(92vw, 520px); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:30; }
.toast.show{ opacity:1; transform:translateX(-50%); pointer-events:auto; }
@media (prefers-reduced-motion: reduce){ .fill,.donut .arc,.details,.g-seg,.toast{ transition:none; } .sheet-card{ animation:none; } } 
</style>
</head>
<body>
<div class="scroll" id="scroller">
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <div>
          <h1>Finanzas de Juan Hilario</h1>
          <p class="sub" id="today"></p>
        </div>
        <button class="icon-btn" id="muteBtn" aria-label="Silenciar sonido y vibración">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema claro/oscuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="board">
        <div class="boxes">
          <div class="box income" id="incomeBox" role="button" tabindex="0">
            <small>Ingresos</small>
            <b>RD$ 0</b>
            <em>Toca para registrar</em>
          </div>
          <div class="box expense" id="expenseBox" role="button" tabindex="0">
            <small>Gastos</small>
            <b>RD$ 0</b>
            <em>Toca para registrar</em>
          </div>
        </div>
        <div class="gauge" id="gauge" role="img" aria-label="Balance financiero">
          <div class="gauge-ring">
            <svg viewBox="0 0 120 120">
              <circle class="g-bg" cx="60" cy="60" r="52" fill="none" stroke-width="14"/>
              <circle class="g-seg" id="gOk" cx="60" cy="60" r="52" fill="none" stroke="var(--green)" stroke-width="14" stroke-linecap="round"/>
              <circle class="g-seg" id="gBad" cx="60" cy="60" r="52" fill="none" stroke="var(--red)" stroke-width="14" stroke-linecap="round"/>
            </svg>
            <div class="g-center">
              <b id="gState">Balance</b>
              <span id="gNet">RD$ 0</span>
            </div>
          </div>
          <div class="g-msg" id="gMsg">Registra ingresos y montos para ver tu balance.</div>
        </div>
      </div>
    </header>

    <div class="sec">
      <h2>Mis obligaciones</h2>
      <button class="add-btn" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Añadir
      </button>
    </div>

    <div class="tools">
      <div class="chips" id="chips"></div>
      <button class="sort" id="sortBtn">Orden: urgencia</button>
    </div>

    <div class="legend">
      <span><i style="background:var(--green)"></i>Corte</span>
      <span><i style="background:var(--yellow)"></i>Personal</span>
      <span><i style="background:var(--red)"></i>Límite</span>
    </div>

    <div class="list" id="list"></div>

    <div class="tools" style="padding-top:16px;">
      <div class="perm" id="perm"></div>
    </div>
  </div>
</div>

<!-- Hoja de Edición / Nueva Obligación -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2 id="shee
